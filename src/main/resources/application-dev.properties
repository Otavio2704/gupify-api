# =============================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO
# =============================================
# Sobrescreve o application.properties para o perfil local.
# Ativar com: SPRING_PROFILES_ACTIVE=dev (já definido no docker-compose.yml)

# Permite que o Hibernate crie/atualize o schema automaticamente em dev.
spring.jpa.hibernate.ddl-auto=update

# Mostra SQL no console para facilitar debug
spring.jpa.show-sql=true
