# =============================================
# SERVIDOR
# =============================================
server.port=${SERVER_PORT:8080}

# =============================================
# BANCO DE DADOS
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gupify}
spring.datasource.username=${DB_USER:gupify_user}
spring.datasource.password=${DB_PASSWORD:senha_segura}
spring.datasource.driver-class-name=org.postgresql.Driver

# Em produção: validate — para se o schema divergir do modelo.
# Em dev: sobrescrito pelo application-dev.properties.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# SPRING AI — NVIDIA NIM via protocolo OpenAI
# =============================================
# ATENÇÃO — CAUSA DA LATÊNCIA (medido em 28/09/2026):
# este modelo é um modelo de RACIOCÍNIO ("reasoning") e, na NVIDIA NIM, o
# "thinking" vem LIGADO por padrão. Ou seja: para cada geração o modelo primeiro
# escreve um monte de tokens de raciocínio invisíveis e só depois o JSON que a
# aplicação usa. A chamada é feita em modo não-streaming (espera tudo para
# responder), sem max-tokens e sem timeout de leitura.
# Resultado real medido em produção: 545 s (9 minutos) para UMA geração.
#
# O modelo precisa ser escolhido com DADOS, não por tentativa: rode
#   python3 bench-nvidia.py            (script entregue junto com este diagnóstico)
# e fixe aqui o modelo com menor latência.
#
# IMPORTANTE: o Spring AI 1.0.0-M6 NÃO tem suporte a "extraBody", então NÃO é
# possível desligar o thinking via propriedades nesta versão (só existe
# reasoningEffort, que a NIM não garante). Para controlar o thinking seria
# necessário subir para o Spring AI 2.x (que tem extraBody) e enviar
# {"chat_template_kwargs": {"enable_thinking": false}}.
spring.ai.openai.api-key=${NVIDIA_API_KEY}
spring.ai.openai.base-url=https://integrate.api.nvidia.com
spring.ai.openai.chat.options.model=nvidia/nemotron-3.5-lightning-30b-a3b

# FIX LATÊNCIA (opcional, seguro SÓ com modelo sem thinking): limita o tamanho da
# resposta. Com thinking ligado o orçamento é consumido pelo raciocínio e o JSON
# pode voltar cortado (=> 422 "resposta inválida"). Descomente depois de escolher
# o modelo no bench:
#spring.ai.openai.chat.options.max-tokens=1200
#spring.ai.openai.chat.options.temperature=0.3

# =============================================
# LIMITES DE CONTEXTO PARA O PROMPT
# =============================================
nvidia.api.cv-max-chars=3000
nvidia.api.job-max-chars=2000

# FIX LATÊNCIA — teto de tempo para o streaming (SSE). Num stream a conexão fica
# aberta recebendo dados; este é o tempo máximo de SILÊNCIO da IA até o endpoint
# desistir e devolver erro tratado ao usuário (não confundir com o read-timeout do
# HttpClientConfig, que vale para as chamadas não-streaming).
nvidia.api.stream-timeout-seconds=120

# =============================================
# SESSÃO ANÔNIMA
# =============================================
session.cookie.max-age-days=${SESSION_COOKIE_MAX_AGE_DAYS:90}
session.expiry-days=${SESSION_EXPIRY_DAYS:180}
# Em produção o cookie é sempre Secure (HTTPS).
# O application-dev.properties sobrescreve para false em localhost.
session.cookie.secure=true

# =============================================
# RATE LIMIT POR SESSÃO
# =============================================
gupify.rate-limit.generations-per-hour=10

# =============================================
# UPLOAD DE ARQUIVOS
# =============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =============================================
# CORS
# =============================================
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# =============================================
# RESILIENCE4J — Rate Limiter (NVIDIA NIM)
# ~40 req/min é o limite do free tier da NIM; usamos 38 com folga.
# =============================================
resilience4j.ratelimiter.instances.nvidia.limit-for-period=38
resilience4j.ratelimiter.instances.nvidia.limit-refresh-period=1m
resilience4j.ratelimiter.instances.nvidia.timeout-duration=5s

# Rate limit para criação de sessão: máximo 30 novas sessões por minuto.
# (Antes era 5/min — muito baixo: cada refresh de página gera 1 chamada a
# POST /api/session, e o React em StrictMode/dev pode disparar em dobro.
# Um limite apertado demais aqui derruba o resto do fluxo, já que sem sessão
# válida todos os outros endpoints (/api/cv, /api/reports) respondem 403 por
# falta de autenticação — o rate limit vira, na prática, uma trava geral.)
resilience4j.ratelimiter.instances.session-create.limit-for-period=30
resilience4j.ratelimiter.instances.session-create.limit-refresh-period=1m
resilience4j.ratelimiter.instances.session-create.timeout-duration=0s

# =============================================
# RESILIENCE4J — Retry (NVIDIA NIM)
# =============================================
# FIX LATÊNCIA — com 3 tentativas e um modelo lento, o pior caso é 3x o tempo de
# geração. 2 tentativas + timeout de leitura de 90s (HttpClientConfig) limitam o
# pior caso a ~3 minutos em vez de "para sempre".
resilience4j.retry.instances.nvidia.max-attempts=2
resilience4j.retry.instances.nvidia.wait-duration=1s
resilience4j.retry.instances.nvidia.enable-exponential-backoff=true
resilience4j.retry.instances.nvidia.exponential-backoff-multiplier=2

# =============================================
# ACTUATOR
# Expõe apenas /actuator/health publicamente.
# /actuator/metrics e /actuator/prometheus bloqueados no SecurityConfig.
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# =============================================
# LOGGING
# =============================================
logging.level.com.gupify=INFO
logging.level.com.gupify.generate=DEBUG
