version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: gupify-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gupify-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      SERVER_PORT: 8080
      SESSION_COOKIE_MAX_AGE_DAYS: 90
      SESSION_EXPIRY_DAYS: 180
      # Ativa o perfil dev para que application-dev.properties
      # sobrescreva ddl-auto=validate com ddl-auto=update
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  postgres_data:
